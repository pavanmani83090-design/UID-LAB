<!DOCTYPE html>
<html>
<head>
    <title>My E-commerce Store</title>

    <style>
        body{
    margin:0;
    font-family: Arial;
}

/* HEADER */
.header{
    padding:22px;
    background-color: lightblue;
    text-align: center;
    font-size: 30px;
}

/* LAYOUT */
.container{
    display: flex;
    height: calc(100vh - 80px); /* full screen below header */
}

/* SIDEBAR */
.sidebar{
    background-color: lightgray;
    padding: 20px;
    width: 200px;
}

.sidebar a{
    text-decoration: none;
    color: black;
}

.sidebar a:hover{
    color: blue;
}

/* MAIN AREA */
.main{
    flex: 1;
}

/* IFRAME FIX */
iframe{
    width: 100%;
    height: 100%;   /* IMPORTANT FIX */
    border: none;
}        
.footer{
            text-align: center;
            background-color: black;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <div class="header">
        My E-commerce Store
    </div>

    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <h3>Categories</h3>

            <p><a href="electronics.html" target="contentframe">Electronics</a></p>
            <p><a href="clothing.html" target="contentframe">Clothing</a></p>
            <p><a href="books.html" target="contentframe">Books</a></p>
            <p><a href="home.html" target="contentframe">Home & Kitchen</a></p>
        </div>

        <!-- Main Content -->
        <div class="main">
            <iframe name="contentframe" src="electronics.html"></iframe>
        </div>

    </div>

    <div class="footer">
        &copy; 2024 My E-commerce Store
    </div>

</body>
</html>
