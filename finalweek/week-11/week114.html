<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial;
        }
        .error {
            color: red;
            font-size: 14px;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>

    <h2>Registration Form</h2>

    <form onsubmit="return validateForm()">

        Name: <input type="text" id="name"><br>
        <span id="nameError" class="error"></span><br>

        Email: <input type="text" id="email"><br>
        <span id="emailError" class="error"></span><br>

        Password: <input type="password" id="password"><br>
        <span id="passError" class="error"></span><br>

        <input type="submit" value="Register">
        <p id="successMsg" class="success"></p>

    </form>

    <script>
        function validateForm() {
            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;

            let valid = true;

            // Clear previous errors
            document.getElementById("nameError").innerHTML = "";
            document.getElementById("emailError").innerHTML = "";
            document.getElementById("passError").innerHTML = "";
            document.getElementById("successMsg").innerHTML = "";

            // Name validation
            if (name === "") {
                document.getElementById("nameError").innerHTML = "Name cannot be empty";
                valid = false;
            }

            // Email validation
            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (!emailPattern.test(email)) {
                document.getElementById("emailError").innerHTML = "Enter a valid email";
                valid = false;
            }

            // Password validation
            if (password.length < 6) {
                document.getElementById("passError").innerHTML = "Password must be at least 6 characters";
                valid = false;
            }

            // If all valid
            if (valid) {
                document.getElementById("successMsg").innerHTML = "Registration Successful!";
            }

            return valid; // Prevent submit if invalid
        }
    </script>

</body>
</html>
